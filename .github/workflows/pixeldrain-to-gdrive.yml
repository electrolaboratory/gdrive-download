name: Pixeldrain to Google Drive

on:
  workflow_dispatch:
    inputs:
      pixeldrain_id:
        description: 'Pixeldrain File ID (Example: if URL is pixeldrain.com/u/1234abcd, enter 1234abcd)'
        required: true
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Download Directory
        run: |
          # Create a staging directory to hold the downloaded files
          mkdir to_upload 

      - name: Download from Pixeldrain
        # Download file automatically using its original name
        run: |
          cd to_upload
          curl -L -O -J "https://pixeldrain.com/api/file/${{ github.event.inputs.pixeldrain_id }}"
          echo "File successfully downloaded:"
          ls -la

      - name: Setup Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone & Upload
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF_SECRET }}
        run: |
          # 1. Generate the rclone configuration file from GitHub Secrets
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          
          # 2. Upload the contents of the 'to_upload' folder to Google Drive
          # Note: It uses the remote name "queen" as defined in your conf file.
          # If you want to upload to a specific folder, change "queen:ROM_Builds" to "queen:Your_Folder_Name"
          echo "Starting upload to Google Drive..."
          rclone copy ./to_upload queen:ROM_Builds --progress -v --tpslimit 2 --transfers 1 --retries 5 --drive-chunk-size 64M
          
          # 3. Security: Remove the configuration file after completion
          rm ~/.config/rclone/rclone.conf
          echo "Upload complete!"
